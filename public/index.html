<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Book Checkout POC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f6f6; }
    .card { max-width: 420px; margin: 70px auto; padding: 28px; background: white;
            border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    p { color: #555; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 8px;
             font-size: 16px; cursor: pointer; background: #111; color: white; }
    button:disabled { opacity: .6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Book</h1>
    <p>Stripe Checkout POC</p>
    <p>Shipping: $7.00 · Canada only</p>
    <button id="buy">Buy Now</button>
  </div>

  <script>
    const button = document.getElementById("buy");

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Opening checkout…";

      try {
        const response = await fetch("/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Checkout failed");

        window.location.href = data.url;
      } catch (err) {
        alert(err.message);
        button.disabled = false;
        button.textContent = "Buy Now";
      }
    });
  </script>
</body>
</html>
